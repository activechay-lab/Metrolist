name: Sync main with upstream

# main is kept as a byte-for-byte mirror of metrolistgroup/metrolist's main —
# never commit to it directly, or this fast-forward-only sync will start
# failing permanently. All custom changes live on the `custom` branch instead.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to upstream
        run: |
          git remote add upstream https://github.com/metrolistgroup/metrolist.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin main
